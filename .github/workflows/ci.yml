name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: pdo_sqlite, curl, mbstring, intl
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer lint
      - run: composer stan
      - run: composer test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:i18n
      - run: mkdir -p ../public && pnpm build
      - run: pnpm test --passWithNoTests

  image:
    needs: [php, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: wishvault:test
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name wv -p 8080:8080 -e GAMEVAULT_URL=https://gamevault.example.com wishvault:test
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/api/v1/info && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/api/v1/info | grep -q '"service":"wishvault"'
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
          sleep 3
          docker exec wv php -r '$p=new PDO("sqlite:/var/www/data/wishvault.sqlite"); echo $p->query("SELECT value FROM jobs_state WHERE key=\"worker_seen\"")->fetchColumn(), PHP_EOL;' | grep -q Z
          docker logs wv | tail -20
      - name: Container logs
        if: always()
        run: docker logs wv 2>&1 | tail -80 || true
      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
